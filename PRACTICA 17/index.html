<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
 <title>Calculadora Hot Sale 🔥</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
 <body>
   <header>
    <h1> HOT SALE</h1>   
</header> 
        <main>
        <section class="producto">
        <h2>Producto seleccionado</h2>
            <div class="detalle">
                <div class="fila"> 
                    <span class="etiqueta"> Precio sin DCTO% </span>
                    <span class="valor" id="precioOriginal"> $0 </span>
                </div>
             <div class="fila descuento">
                 <span class="etiqueta">Descuento aplicado:</span>
                    <span class="valor" id="descuento">0%</span>
                </div>

                 <div class="separador"></div>

                <div class="fila total">
                    <span class="etiqueta">Precio con descuento:</span>
                    <span class="valor" id="precioFinal">$0</span>
                </div>
                <div class="ahorro">
                <p>DCTO <span id="montoAhorro">$0</span>!</p>
            </div>
        </section>
    </main>

        </section>
        </main>
<script src="js/script.js"></script>
 </body>
</html>
